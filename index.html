<!doctype html>

<head>

  <title>Anime Primer</title>

  <script src="https://cdn.tailwindcss.com/3.4.10?plugins=typography"></script>
  <style>
    .jp { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
    /* Flashcard flip */
    .flip { perspective: 1200px; cursor: pointer; }
    .flip-inner { position: relative; min-height: 18rem; transition: transform .5s; transform-style: preserve-3d; }
    .flip.flipped .flip-inner { transform: rotateY(180deg); }
    .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip-back { transform: rotateY(180deg); }
    @media (prefers-reduced-motion: reduce) { .flip-inner { transition: none; } }
  </style>
</head>
